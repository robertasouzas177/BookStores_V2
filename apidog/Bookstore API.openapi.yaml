          type: string
          format: date-time
          description: >-
            Data e hora da venda; corresponde ao timestamp `data` no Firestore e
            é exposto em ISO 8601.
          x-firebase-field: data
          example: '2026-05-06T10:06:00-03:00'
      description: >-
        Representação de uma venda conforme os campos `clienteId`,
        `clienteNome`, `data`, `desconto`, `formaPagamento`, `itens`,
        `totalBruto`, `totalFinal`, `vendedorId` e `vendedorNome` existentes no
        Firestore.
    CreateSaleDTO:
      type: object
      required:
        - clientId
        - paymentMethod
        - items
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            ID do documento do cliente na coleção `Clientes` do Firestore. Não é
            CPF nem e-mail.
          x-firebase-field: clienteId
          example: 8NV1c7Q4TCYGcsuPch8I
        paymentMethod:
          type: string
          description: >-
            Forma de pagamento armazenada como texto em `formaPagamento`. Valor
            confirmado nos exemplos do Firebase: `Dinheiro`; não se presume
            enumeração de outros valores.
          x-firebase-field: formaPagamento
          example: Dinheiro
        discount:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Valor inteiro do desconto registrado na venda; corresponde ao campo
            `desconto` no Firestore.
          format: int64
          x-firebase-field: desconto
          example: 0
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateSaleItemDTO'
          description: >-
            Itens que compõem a venda. Cada item referencia um documento da
            coleção `Produtos` e contém quantidade e preço/título registrados no
            momento da venda. Corresponde a `itens` no Firestore.
          example:
            - productId: KIYBXACS6uVj5DbKEsPQ
              quantity: 2
      description: >-
        Dados de entrada para registrar venda. O identificador do vendedor é
        obtido pela lógica de autenticação da aplicação, caso assim esteja
        implementado; a origem exata deve ser confirmada.
    PaginatedSalesResponse:
      type: object
      description: Envelope paginado de vendas.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
          description: >-
            Atributo `data` do schema PaginatedSalesResponse. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: []
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    HealthCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
          description: >-
            Atributo `status` do schema HealthCheck. Representa o valor indicado
            pelo próprio nome do campo; consulte o mapeamento Firebase quando
            informado.
          example: UP
        latencyMs:
          type: integer
          description: >-
            Atributo `latencyMs` do schema HealthCheck. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: 12
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
          description: >-
            Atributo `status` do schema HealthResponse. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: UP
        checks:
          type: object
          description: Estado de cada dependência (apenas em `/health/ready`).
          additionalProperties:
            $ref: '#/components/schemas/HealthCheck'
          properties: {}
          example:
            database:
              status: UP
              latencyMs: 12
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 20
          maxLength: 512
          description: >-
            Atributo `refreshToken` do schema RefreshRequest. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: rt_9f82a1c0d4e5b6a7c8d9e0f1a2b3c4d5
  responses:
    BadRequest:
      description: Requisição malformada (JSON inválido, parâmetro ausente).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            Sucesso:
              summary: Sucesso
              value:
                type: https://api.bookstore.dev/errors/bad-request
                title: Requisição Inválida
                status: 400
                detail: O corpo da requisição não é um JSON válido.
                instance: /api/v1/products
                code: BAD_REQUEST
      headers:
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    Unauthorized:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            token-expired:
              summary: token-expired
              value:
                type: https://api.bookstore.dev/errors/unauthorized
                title: Não Autenticado
                status: 401
                detail: O token de acesso está expirado.
                instance: /api/v1/products
                code: AUTH_TOKEN_EXPIRED
            token-missing:
              summary: token-missing
              value:
                type: https://api.bookstore.dev/errors/unauthorized
                title: Não Autenticado
                status: 401
                detail: O cabeçalho Authorization não foi informado.
                instance: /api/v1/products
                code: AUTH_TOKEN_MISSING
      headers:
        WWW-Authenticate:
          description: ''
          required: false
          schema:
            type: string
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    Forbidden:
      description: Autenticado, porém sem a permissão (escopo) exigida pela operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            Sucesso:
              summary: Sucesso
              value:
                type: https://api.bookstore.dev/errors/forbidden
                title: Acesso Negado
                status: 403
                detail: >-
                  Sua conta não possui a permissão 'products:write' exigida por
                  esta operação.
                instance: /api/v1/products
                code: INSUFFICIENT_PERMISSIONS
      headers:
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            Sucesso:
              summary: Sucesso
              value:
                type: https://api.bookstore.dev/errors/not-found
                title: Recurso Inexistente
                status: 404
                detail: O recurso com o identificador informado não foi localizado.
                instance: /api/v1/products/00000000-0000-0000-0000-000000000000
                code: NOT_FOUND
      headers:
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    Conflict:
      description: >-
        Conflito de estado (ex.: e-mail/ISBN já cadastrado, estoque
        insuficiente).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            duplicate-resource:
              summary: duplicate-resource
              value:
                type: https://api.bookstore.dev/errors/duplicate-resource
                title: Recurso Duplicado
                status: 409
                detail: Já existe um registro com o e-mail informado.
                instance: /api/v1/clients
                code: DUPLICATE_RESOURCE
            insufficient-stock:
              summary: insufficient-stock
              value:
                type: https://api.bookstore.dev/errors/insufficient-stock
                title: Estoque Insuficiente
                status: 409
                detail: 'O produto ''Duna'' possui 1 unidade em estoque; solicitadas: 2.'
                instance: /api/v1/sales
                code: INSUFFICIENT_STOCK
            resource-in-use:
              summary: resource-in-use
              value:
                type: https://api.bookstore.dev/errors/resource-in-use
                title: Recurso em Uso
                status: 409
                detail: O produto possui vendas associadas e não pode ser removido.
                instance: /api/v1/products/KIYBXACS6uVj5DbKEsPQ
                code: RESOURCE_IN_USE
            idempotency-in-progress:
              summary: idempotency-in-progress
              value:
                type: https://api.bookstore.dev/errors/idempotency-in-progress
                title: Requisição em Andamento
                status: 409
                detail: >-
                  Já existe uma requisição em processamento com esta
                  Idempotency-Key.
                instance: /api/v1/sales
                code: IDEMPOTENCY_IN_PROGRESS
      headers:
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    UnprocessableEntity:
      description: Sintaxe correta, porém violação de regras de validação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validation-failed:
              summary: validation-failed
              value:
                type: https://api.bookstore.dev/errors/validation-failed
                title: Erro de Validação de Dados
                status: 422
                detail: >-
                  O campo 'title' é obrigatório e deve conter no mínimo 1
                  caractere.
                instance: /api/v1/products
                invalidParams:
                  - name: title
                    reason: Campo obrigatório
                code: VALIDATION_FAILED
            idempotency-key-mismatch:
              summary: idempotency-key-mismatch
              value:
                type: https://api.bookstore.dev/errors/idempotency-key-mismatch
                title: Chave de Idempotência Reutilizada
                status: 422
                detail: >-
                  A Idempotency-Key já foi usada com um corpo de requisição
                  diferente.
                instance: /api/v1/sales
                code: IDEMPOTENCY_KEY_MISMATCH
      headers:
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    TooManyRequests:
      description: Limite de requisições excedido (rate limiting).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            Sucesso:
              summary: Sucesso
              value:
                type: https://api.bookstore.dev/errors/too-many-requests
                title: Muitas Requisições
                status: 429
                detail: Limite de requisições excedido. Tente novamente em instantes.
                instance: /api/v1/auth/login
                code: TOO_MANY_REQUESTS
      headers:
        Retry-After:
          description: ''
          required: false
          schema:
            type: string
        RateLimit-Limit:
          description: ''
          required: false
          schema:
            type: string
        RateLimit-Remaining:
          description: ''
          required: false
          schema:
            type: string
        RateLimit-Reset:
          description: ''
          required: false
          schema:
            type: string
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    PreconditionFailed:
      description: A versão do recurso mudou desde a leitura (`If-Match` não confere).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            Sucesso:
              summary: Sucesso
              value:
                type: https://api.bookstore.dev/errors/precondition-failed
                title: Pré-condição Falhou
                status: 412
                detail: >-
                  O recurso foi modificado por outro usuário. Releia (GET) e
                  tente novamente.
                instance: /api/v1/products/KIYBXACS6uVj5DbKEsPQ
                code: PRECONDITION_FAILED
      headers:
        ETag:
          description: ''
          required: false
          schema:
            type: string
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    UnsupportedMediaType:
      description: '`Content-Type` não suportado. Use `application/json`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            Sucesso:
              summary: Sucesso
              value:
                type: https://api.bookstore.dev/errors/unsupported-media-type
                title: Tipo de Mídia Não Suportado
                status: 415
                detail: >-
                  Content-Type 'text/plain' não é suportado. Use
                  'application/json'.
                instance: /api/v1/products
                code: UNSUPPORTED_MEDIA_TYPE
      headers:
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    InternalError:
      description: >-
        Erro interno não tratado. Detalhes técnicos ficam apenas nos logs
        (correlacionar via `X-Request-Id`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            Sucesso:
              summary: Sucesso
              value:
                type: https://api.bookstore.dev/errors/internal-error
                title: Erro Interno do Servidor
                status: 500
                detail: Ocorreu um erro inesperado. Informe o X-Request-Id ao suporte.
                instance: /api/v1/products
                code: INTERNAL_ERROR
      headers:
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    ServiceUnavailable:
      description: >-
        Serviço temporariamente indisponível (manutenção, sobrecarga ou
        dependência fora do ar).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            Sucesso:
              summary: Sucesso
              value:
                type: https://api.bookstore.dev/errors/service-unavailable
                title: Serviço Indisponível
                status: 503
                detail: >-
                  O serviço está temporariamente indisponível. Tente novamente
                  em instantes.
                instance: /api/v1/products
                code: SERVICE_UNAVAILABLE
      headers:
        Retry-After:
          description: ''
          required: false
          schema:
            type: string
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
    NotModified:
      description: >-
        O recurso não mudou desde a versão informada em `If-None-Match`. Sem
        corpo.
      content:
        application/json:
          schema:
            type: object
            properties: {}
      headers:
        ETag:
          description: ''
          required: false
          schema:
            type: string
        Cache-Control:
          description: ''
          required: false
          schema:
            type: string
        RateLimit-Limit:
          description: ''
          required: false
          schema:
            type: string
        RateLimit-Remaining:
          description: ''
          required: false
          schema:
            type: string
        RateLimit-Reset:
          description: ''
          required: false
          schema:
            type: string
        X-Request-Id:
          description: ''
          required: false
          schema:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token JWT Bearer usado pela API. Os campos informados do Firebase não
        confirmam claims `role` ou `permissions`; qualquer regra de autorização
        por perfil depende da implementação e deve ser validada separadamente.
servers: []
security: []
