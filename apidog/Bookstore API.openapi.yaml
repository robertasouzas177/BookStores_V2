  /health/live:
    get:
      summary: Liveness probe
      deprecated: false
      description: >-
        Indica se o **processo** está vivo (não trava em deadlock). Verifica
        somente a própria aplicação, **sem consultar o banco**; falha aqui faz o
        orquestrador reiniciar o container. Rota pública.
      operationId: healthLive
      tags:
        - Health
      parameters: []
      responses:
        '200':
          description: Processo ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
          headers:
            Cache-Control:
              example: no-store
              required: false
              description: Nunca armazenar.
              schema:
                type: string
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
      security: []
  /health/ready:
    get:
      summary: Readiness probe
      deprecated: false
      description: >-
        Indica se a instância está **pronta para receber tráfego** (banco
        conectado, migrações aplicadas). Falha aqui retira a instância do
        balanceador, **sem reiniciá-la**. Rota pública.
      operationId: healthReady
      tags:
        - Health
      parameters: []
      responses:
        '200':
          description: Pronta para tráfego.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                checks:
                  database:
                    status: UP
                    latencyMs: 12
          headers:
            Cache-Control:
              example: no-store
              required: false
              description: Nunca armazenar.
              schema:
                type: string
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
        '503':
          description: Dependência indisponível; instância removida do balanceamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: DOWN
                checks:
                  database:
                    status: DOWN
          headers:
            Cache-Control:
              example: no-store
              required: false
              description: Nunca armazenar.
              schema:
                type: string
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
            Retry-After:
              required: false
              description: ''
              schema:
                type: string
      security: []
components:
  schemas:
    ApiError:
      type: object
      description: >-
        Problem Details para APIs HTTP (RFC 9457, que obsoletou a RFC 7807).
        Content-Type: `application/problem+json`.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: >-
            URI que identifica o tipo do problema (`about:blank` se não houver
            documentação dedicada).
          example: https://api.bookstore.dev/errors/validation-failed
        title:
          type: string
          description: Resumo curto e legível do problema.
          example: Erro de Validação de Dados
        status:
          type: integer
          description: Código de status HTTP.
          example: 422
        detail:
          type: string
          description: Explicação específica desta ocorrência.
          example: O campo 'title' é obrigatório.
        instance:
          type: string
          description: URI da requisição que originou o erro.
          example: /api/v1/products
        invalidParams:
          type: array
          description: 'Extensão: lista de campos inválidos.'
          items:
            type: object
            required:
              - name
              - reason
            properties:
              name:
                type: string
                example: title
              reason:
                type: string
                example: Tamanho insuficiente
          example: []
        code:
          type: string
          description: >-
            Extensão: código de erro estável e legível por máquina (ex.:
            `AUTH_TOKEN_EXPIRED`), para o cliente tomar decisões sem depender do
            texto.
          example: VALIDATION_FAILED
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - totalItems
        - totalPages
        - hasNext
      properties:
        page:
          type: integer
          description: >-
            Atributo `page` do schema PaginationMeta. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: 1
        limit:
          type: integer
          description: >-
            Atributo `limit` do schema PaginationMeta. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: 10
        totalItems:
          type: integer
          description: >-
            Atributo `totalItems` do schema PaginationMeta. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: 42
        totalPages:
          type: integer
          description: >-
            Atributo `totalPages` do schema PaginationMeta. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: 5
        hasNext:
          type: boolean
          description: >-
            Atributo `hasNext` do schema PaginationMeta. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: true
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: >-
            Atributo `email` do schema LoginRequest. Representa o valor indicado
            pelo próprio nome do campo; consulte o mapeamento Firebase quando
            informado.
          example: admin@api.com
        password:
          type: string
          format: password
          minLength: 1
          description: >-
            Atributo `password` do schema LoginRequest. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: Sup3rS3cr3t!
    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - refreshExpiresIn
      properties:
        accessToken:
          type: string
          description: 'JWT de acesso (curta duração). Enviar em `Authorization: Bearer`.'
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: >-
            Token opaco de renovação (longa duração, **uso único**: cada
            renovação o substitui por um novo). Enviar apenas em `/auth/refresh`
            e `/auth/logout`.
          example: rt_9f82a1c0d4e5b6a7c8d9e0f1a2b3c4d5
        tokenType:
          type: string
          enum:
            - Bearer
          description: >-
            Atributo `tokenType` do schema TokenResponse. Representa o valor
            indicado pelo próprio nome do campo; consulte o mapeamento Firebase
            quando informado.
          example: Bearer
        expiresIn:
          type: integer
          description: Validade do access token em segundos (900 = 15 min).
          example: 900
        refreshExpiresIn:
          type: integer
          description: Validade do refresh token em segundos (1209600 = 14 dias).
          example: 1209600
    User:
      type: object
      required:
        - id
        - name
        - email
        - active
        - createdAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: ID do documento da coleção `UsuarioAPI` no Firestore.
          readOnly: true
          example: SDMXDsjJtqcqK1nWnrk0YjQDqPY2
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: >-
