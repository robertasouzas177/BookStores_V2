openapi: 3.0.1
info:
  title: Bookstore API
  description: >-
    API REST de gerenciamento de uma **livraria**: catálogo de livros, clientes
    do programa de fidelidade, vendas e usuários da plataforma.


    ### Convenções

    - **Versionamento:** por URI (`/api/v1`). Sondas de saúde ficam em
    `/health/*`, sem prefixo.

    - **Formato:** JSON (`application/json`). Datas/timestamps em ISO 8601. IDs
    dos documentos de negócio são strings geradas pelo Firestore.

    - **Erros:** RFC 9457 (`application/problem+json`) com `type`, `title`,
    `status`, `detail`, `instance` e, como extensões, `code` (estável, para
    máquinas) e `invalidParams`.

    - **Paginação:** `page` e `limit` (padrão 1 e 10, máx. 100). Listagens
    retornam `{ data, meta }`.

    - **Ordenação:** `sort=-createdAt,price` (prefixo `-` = decrescente),
    restrita a uma lista de campos permitidos.


    ### Autenticação e autorização

    - **Login** (`POST /auth/login`) retorna um **access token** JWT (15 min) e
    um **refresh token** opaco (14 dias).

    - **Renovação** (`POST /auth/refresh`) usa **rotação**: cada refresh token é
    de uso único; reutilizar um já consumido revoga a sessão inteira.

    - **Autorização:** os campos fornecidos do Firebase não confirmam `role` nem
    `permissions`. A existência e as regras de autorização devem ser confirmadas
    na implementação; não são consideradas atributos persistidos.

    - **Rotas públicas:** `/auth/login`, `/auth/refresh` e `/health/*`.


    ### Cabeçalhos relevantes

    - `X-Request-Id` (resposta em todas as rotas) e `traceparent` (W3C, opcional
    na requisição): rastreabilidade.

    - `RateLimit-Limit` / `RateLimit-Remaining` / `RateLimit-Reset` e
    `Retry-After`: Token Bucket (capacidade 100, reposição 100/min; cada rota
    consome 1 a 5 tokens). Excesso → **429**.

    - `ETag` + `If-None-Match` (**304**) e `ETag` + `If-Match` em PATCH
    (**412**).

    - `Idempotency-Key`: segurança contra duplicidade em `POST /sales`.


    ### Observação sobre perfis

    Os perfis `ADMIN` e `SELLER` e suas permissões não foram confirmados nos
    campos informados do Firebase. Não são documentados como atributos
    persistidos.


    **Persistência documentada:** os registros são armazenados no Firebase/Cloud
    Firestore. IDs de documentos são strings geradas pelo Firestore, não UUIDs.
    Timestamps do Firestore são representados na API como strings ISO 8601. Os
    nomes dos campos da API podem estar em camelCase/inglês, com correspondência
    documentada aos campos persistidos.
  version: 1.0.0
  contact:
    name: Equipe Bookstore
  x-revision: v3
  x-firebase-source-of-truth: >-
    Os tipos e nomes dos campos persistidos no Cloud Firestore prevalecem sobre
    os nomes/formatos da API. A API não pressupõe campos não informados.
  x-apidog-mock-note: >-
    As regras x-apidog-mock são extensões de Mock por propriedade para
    importação no Apidog. IDs de documentos Firestore usam strings opacas; não
    usar @guid para IDs de negócio.
tags:
  - name: Auth
  - name: Users
  - name: Products
  - name: Clients
  - name: Sales
  - name: Health
paths:
  /api/v1/auth/login:
    post:
      summary: Autenticar usuário
      deprecated: false
      description: >-
        Autentica com e-mail e senha e retorna um **access token** (JWT, 15 min)
        e um **refresh token** (opaco, 14 dias, uso único com rotação). Rota
        pública, com rate limit mais restrito (custo 5 tokens por tentativa). A
        mensagem de erro não revela se o e-mail existe.


        **Custo de rate limit:** 5 tokens (Token Bucket: capacidade 100,
        reposição 100/min).
      operationId: login
      tags:
        - Auth
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@api.com
              password: Sup3rS3cr3t!
        required: true
      responses:
        '200':
          description: Autenticação realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: rt_9f82a1c0d4e5b6a7c8d9e0f1a2b3c4d5
                tokenType: Bearer
                expiresIn: 900
                refreshExpiresIn: 1209600
          headers:
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Limit:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Remaining:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Reset:
              required: false
              description: ''
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Requisição malformada (JSON inválido, parâmetro ausente).
        '401':
          description: Credenciais inválidas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: https://api.bookstore.dev/errors/invalid-credentials
                title: Credenciais Inválidas
                status: 401
                detail: E-mail ou senha incorretos.
                instance: /api/v1/auth/login
                code: INVALID_CREDENTIALS
          headers:
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
            WWW-Authenticate:
              required: false
              description: ''
              schema:
                type: string
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
          description: '`Content-Type` não suportado. Use `application/json`.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Sintaxe correta, porém violação de regras de validação.
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Limite de requisições excedido (rate limiting).
        '500':
          $ref: '#/components/responses/InternalError'
          description: >-
            Erro interno não tratado. Detalhes técnicos ficam apenas nos logs
            (correlacionar via `X-Request-Id`).
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: >-
            Serviço temporariamente indisponível (manutenção, sobrecarga ou
            dependência fora do ar).
      security: []
  /api/v1/auth/refresh:
    post:
      summary: Renovar tokens (rotação)
      deprecated: false
      description: >-
        Troca um refresh token válido por um **novo par** (access + refresh). O
        refresh token enviado é invalidado (**uso único**). Se um refresh token
        **já utilizado** for reapresentado (indício de roubo/replay), toda a
        família de tokens da sessão é **revogada** e o usuário precisa
        autenticar novamente. Rota pública.


        **Custo de rate limit:** 3 tokens (Token Bucket: capacidade 100,
        reposição 100/min).
      operationId: refreshToken
      tags:
        - Auth
      parameters:
        - name: traceparent
          in: header
          description: >-
            Contexto de rastreamento distribuído (W3C Trace Context). Se
            enviado, a API continua o mesmo trace; caso contrário, inicia um
            novo.
          required: false
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          schema:
            type: string
            pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        - name: X-Request-Id
          in: header
          description: >-
            Identificador de correlação gerado pelo cliente (UUID). Se ausente
            ou inválido, o servidor gera um e o devolve na resposta.
          required: false
          example: 8NV1c7Q4TCYGcsuPch8I
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: rt_9f82a1c0d4e5b6a7c8d9e0f1a2b3c4d5
        required: true
      responses:
        '200':
          description: Novo par de tokens emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: rt_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
                tokenType: Bearer
                expiresIn: 900
                refreshExpiresIn: 1209600
          headers:
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Limit:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Remaining:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Reset:
              required: false
              description: ''
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Requisição malformada (JSON inválido, parâmetro ausente).
        '401':
          description: Refresh token inválido, expirado ou reutilizado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                refresh-token-invalid:
                  summary: Inválido ou expirado
                  value:
                    type: https://api.bookstore.dev/errors/refresh-token-invalid
                    title: Refresh Token Inválido
                    status: 401
                    detail: O refresh token informado é inválido ou expirou.
                    instance: /api/v1/auth/refresh
                    code: REFRESH_TOKEN_INVALID
                refresh-token-reuse-detected:
                  summary: Reuso detectado
                  value:
                    type: >-
                      https://api.bookstore.dev/errors/refresh-token-reuse-detected
                    title: Reuso de Refresh Token Detectado
                    status: 401
                    detail: >-
                      Um refresh token já utilizado foi reapresentado. A sessão
                      foi encerrada por segurança; faça login novamente.
                    instance: /api/v1/auth/refresh
                    code: REFRESH_TOKEN_REUSED
          headers:
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
            WWW-Authenticate:
              required: false
              description: ''
              schema:
                type: string
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
          description: '`Content-Type` não suportado. Use `application/json`.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Sintaxe correta, porém violação de regras de validação.
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Limite de requisições excedido (rate limiting).
        '500':
          $ref: '#/components/responses/InternalError'
          description: >-
            Erro interno não tratado. Detalhes técnicos ficam apenas nos logs
            (correlacionar via `X-Request-Id`).
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: >-
            Serviço temporariamente indisponível (manutenção, sobrecarga ou
            dependência fora do ar).
      security:
        - bearerAuth: []
  /api/v1/auth/logout:
    post:
      summary: Encerrar sessão
      deprecated: false
      description: >-
        Revoga o refresh token informado e toda a sua família (sessão). O access
        token atual continua válido até expirar (máx. 15 min), por ser
        stateless.


        **Custo de rate limit:** 1 token (Token Bucket: capacidade 100,
        reposição 100/min).
      operationId: logout
      tags:
        - Auth
      parameters:
        - name: traceparent
          in: header
          description: >-
            Contexto de rastreamento distribuído (W3C Trace Context). Se
            enviado, a API continua o mesmo trace; caso contrário, inicia um
            novo.
          required: false
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          schema:
            type: string
            pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        - name: X-Request-Id
          in: header
          description: >-
            Identificador de correlação gerado pelo cliente (UUID). Se ausente
            ou inválido, o servidor gera um e o devolve na resposta.
          required: false
          example: 8NV1c7Q4TCYGcsuPch8I
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: rt_9f82a1c0d4e5b6a7c8d9e0f1a2b3c4d5
        required: true
      responses:
        '204':
          description: Sessão encerrada. Sem corpo na resposta.
          headers:
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Limit:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Remaining:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Reset:
              required: false
              description: ''
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Requisição malformada (JSON inválido, parâmetro ausente).
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Token ausente, inválido ou expirado.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
          description: '`Content-Type` não suportado. Use `application/json`.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Sintaxe correta, porém violação de regras de validação.
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Limite de requisições excedido (rate limiting).
        '500':
          $ref: '#/components/responses/InternalError'
          description: >-
            Erro interno não tratado. Detalhes técnicos ficam apenas nos logs
            (correlacionar via `X-Request-Id`).
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: >-
            Serviço temporariamente indisponível (manutenção, sobrecarga ou
            dependência fora do ar).
      security:
        - bearerAuth: []
  /api/v1/auth/me:
    get:
      summary: Obter usuário autenticado
      deprecated: false
      description: >-
        Retorna o perfil do usuário dono do token (inclui `role`). Útil para o
        front-end decidir o que exibir; **não** substitui a checagem de
        permissão no servidor.


        **Custo de rate limit:** 1 token (Token Bucket: capacidade 100,
        reposição 100/min).
      operationId: getMe
      tags:
        - Auth
      parameters:
        - name: traceparent
          in: header
          description: >-
            Contexto de rastreamento distribuído (W3C Trace Context). Se
            enviado, a API continua o mesmo trace; caso contrário, inicia um
            novo.
          required: false
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          schema:
            type: string
            pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        - name: X-Request-Id
          in: header
          description: >-
            Identificador de correlação gerado pelo cliente (UUID). Se ausente
            ou inválido, o servidor gera um e o devolve na resposta.
          required: false
          example: 8NV1c7Q4TCYGcsuPch8I
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Cache-Control:
              example: no-store
              required: false
              description: Nunca armazenar.
              schema:
                type: string
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Limit:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Remaining:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Reset:
              required: false
              description: ''
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Token ausente, inválido ou expirado.
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Limite de requisições excedido (rate limiting).
        '500':
          $ref: '#/components/responses/InternalError'
          description: >-
            Erro interno não tratado. Detalhes técnicos ficam apenas nos logs
            (correlacionar via `X-Request-Id`).
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: >-
            Serviço temporariamente indisponível (manutenção, sobrecarga ou
            dependência fora do ar).
      security:
        - bearerAuth: []
  /api/v1/users:
    get:
      summary: Listar usuários
      deprecated: false
      description: >-
        Retorna a lista paginada de usuários da coleção `UsuarioAPI`.


        **Custo de rate limit:** 2 tokens (Token Bucket: capacidade 100,
        reposição 100/min). Suporta validação condicional: envie `If-None-Match`
        com o `ETag` recebido e obtenha **304** se nada mudou.
      operationId: listUsers
      tags:
        - Users
      parameters:
        - name: page
          in: query
          description: Página atual.
          required: false
          example: ''
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Itens por página.
          required: false
          example: ''
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: role
          in: query
          description: Filtra por perfil.
          required: false
          example: ''
          schema:
            type: string
            enum:
              - ADMIN
              - SELLER
        - name: active
          in: query
          description: Filtra por usuários ativos/inativos.
          required: false
          example: ''
          schema:
            type: boolean
        - name: If-None-Match
          in: header
          description: >-
            ETag previamente recebido. Se o recurso não mudou, a API responde
            **304 Not Modified** sem corpo.
          required: false
          example: W/"33a64df551425fcc55e4d42a148795d9"
          schema:
            type: string
        - name: traceparent
          in: header
          description: >-
            Contexto de rastreamento distribuído (W3C Trace Context). Se
            enviado, a API continua o mesmo trace; caso contrário, inicia um
            novo.
          required: false
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          schema:
            type: string
            pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        - name: X-Request-Id
          in: header
          description: >-
            Identificador de correlação gerado pelo cliente (UUID). Se ausente
            ou inválido, o servidor gera um e o devolve na resposta.
          required: false
          example: 8NV1c7Q4TCYGcsuPch8I
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista paginada de usuários.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersResponse'
          headers:
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Limit:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Remaining:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Reset:
              required: false
              description: ''
              schema:
                type: string
            ETag:
              required: false
              description: ''
              schema:
                type: string
            Cache-Control:
              required: false
              description: ''
              schema:
                type: string
        '304':
          $ref: '#/components/responses/NotModified'
          description: >-
            O recurso não mudou desde a versão informada em `If-None-Match`. Sem
            corpo.
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Token ausente, inválido ou expirado.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Autenticado, porém sem a permissão (escopo) exigida pela operação.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Sintaxe correta, porém violação de regras de validação.
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Limite de requisições excedido (rate limiting).
        '500':
          $ref: '#/components/responses/InternalError'
          description: >-
            Erro interno não tratado. Detalhes técnicos ficam apenas nos logs
            (correlacionar via `X-Request-Id`).
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: >-
            Serviço temporariamente indisponível (manutenção, sobrecarga ou
            dependência fora do ar).
      security:
        - bearerAuth: []
    post:
      summary: Criar usuário
      deprecated: false
      description: >-
        Cadastra um novo usuário da API. A senha nunca é retornada.


        **Custo de rate limit:** 3 tokens (Token Bucket: capacidade 100,
        reposição 100/min).
      operationId: createUser
      tags:
        - Users
      parameters:
        - name: traceparent
          in: header
          description: >-
            Contexto de rastreamento distribuído (W3C Trace Context). Se
            enviado, a API continua o mesmo trace; caso contrário, inicia um
            novo.
          required: false
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          schema:
            type: string
            pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        - name: X-Request-Id
          in: header
          description: >-
            Identificador de correlação gerado pelo cliente (UUID). Se ausente
            ou inválido, o servidor gera um e o devolve na resposta.
          required: false
          example: 8NV1c7Q4TCYGcsuPch8I
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDTO'
            example:
              name: Novo usuário
              email: novo.usuario@example.com
              password: SenhaTemporaria123!
              phone: '16999999999'
        required: true
      responses:
        '201':
          description: Usuário criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Location:
              example: /api/v1/users/SDMXDsjJtqcqK1nWnrk0YjQDqPY2
              required: false
              description: URI do recurso criado.
              schema:
                type: string
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Limit:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Remaining:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Reset:
              required: false
              description: ''
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Requisição malformada (JSON inválido, parâmetro ausente).
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Token ausente, inválido ou expirado.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Autenticado, porém sem a permissão (escopo) exigida pela operação.
        '409':
          $ref: '#/components/responses/Conflict'
          description: >-
            Conflito de estado (ex.: e-mail/ISBN já cadastrado, estoque
            insuficiente).
        '415':
