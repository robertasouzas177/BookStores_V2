    post:
      summary: Registrar venda
      deprecated: false
      description: >-
        Registra uma venda. **Regras de negócio:** o vendedor é obtido do JWT; o
        preço unitário de cada item é lido do cadastro do produto (snapshot
        gravado na venda); o estoque dos produtos é decrementado e os pontos de
        fidelidade do cliente são creditados automaticamente. Retorna **409** se
        algum item tiver estoque insuficiente.


        **Custo de rate limit:** 5 tokens (Token Bucket: capacidade 100,
        reposição 100/min). Envie `Idempotency-Key` para evitar vendas
        duplicadas em caso de retry.
      operationId: createSale
      tags:
        - Sales
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            Chave única gerada pelo cliente (recomendado: UUID v4) para tornar o
            POST seguro contra repetições (retry/duplo clique). Mesma chave +
            mesmo corpo → mesma resposta, sem nova venda. Chave válida por 24h.
          required: false
          example: 8NV1c7Q4TCYGcsuPch8I
          schema:
            type: string
            minLength: 16
            maxLength: 128
        - name: traceparent
          in: header
          description: >-
            Contexto de rastreamento distribuído (W3C Trace Context). Se
            enviado, a API continua o mesmo trace; caso contrário, inicia um
            novo.
          required: false
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          schema:
            type: string
            pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        - name: X-Request-Id
          in: header
          description: >-
            Identificador de correlação gerado pelo cliente (UUID). Se ausente
            ou inválido, o servidor gera um e o devolve na resposta.
          required: false
          example: 8NV1c7Q4TCYGcsuPch8I
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleDTO'
            example:
              clientId: 8NV1c7Q4TCYGcsuPch8I
              paymentMethod: Dinheiro
              discount: 0
              items:
                - productId: KIYBXACS6uVj5DbKEsPQ
                  quantity: 2
        required: true
      responses:
        '201':
          description: Venda registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          headers:
            Location:
              example: /api/v1/sales/8NV1c7Q4TCYGcsuPch8I
              required: false
              description: URI do recurso criado.
              schema:
                type: string
            X-Request-Id:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Limit:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Remaining:
              required: false
              description: ''
              schema:
                type: string
            RateLimit-Reset:
              required: false
              description: ''
              schema:
                type: string
            Idempotency-Replayed:
              required: false
              description: ''
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Requisição malformada (JSON inválido, parâmetro ausente).
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Token ausente, inválido ou expirado.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Autenticado, porém sem a permissão (escopo) exigida pela operação.
        '404':
          $ref: '#/components/responses/NotFound'
          description: Recurso não encontrado.
        '409':
          $ref: '#/components/responses/Conflict'
